name: Python source syntax
# One lightweight job per PR (not per push); no pip, Windows runner or setup-python.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Parse Python sources (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Parse Python sources (non-destructive)
        shell: bash
        run: |
          python3 -c "import pathlib,ast; files=list(pathlib.Path('.').rglob('*.py')); [ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p)) for p in files]; print(f'Parsed {len(files)} Python files')"

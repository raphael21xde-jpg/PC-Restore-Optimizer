name: Quality checks
# PR = fast Linux safety checks; full suite = explicit approval or release tag.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a manually requested full validation or release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-tests:
    name: Fast PR safety (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies (cached)
        run: python -m pip install -r requirements.txt
      - name: Fast metadata, selection and non-destructive safety tests
        run: |
          python -m unittest discover -s tests -p "test_inventory_file_index.py" -v
          python -m unittest discover -s tests -p "test_inventory_paged_v044_v046.py" -v
          python -m unittest discover -s tests -p "test_index_choices_bridge.py" -v
          python -m unittest discover -s tests -p "test_storage_safety_v072.py" -v
          python -m unittest discover -s tests -p "test_backup_target_preflight_v082.py" -v
          python -m unittest discover -s tests -p "test_safe_features.py" -v

  safe-unit-tests:
    name: Full regression (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install declared runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Test GUID volume inventory (no disk writes)
        run: python -m unittest discover -s tests -p "test_volume_inventory_v071.py" -v
      - name: 'Test #25 isolated corruption detection and restore guard'
        run: python -m unittest discover -s tests -p "test_autoteste_integridade_v025.py" -v
      - name: 'Test #26 synthetic missing files and incomplete backups'
        run: python -m unittest discover -s tests -p "test_autoteste_completude_v026.py" -v
      - name: 'Test #27 synthetic cancellation and SHA-256 verified resume'
        run: python -m unittest discover -s tests -p "test_autoteste_interrupcao_v027.py" -v
      - name: 'Test #28-30 synthetic multi-block, corruption repair and resume guards'
        run: python -m unittest discover -s tests -p "test_autotestes_resiliencia_v028_v030.py" -v
      - name: 'Test #31-34 synthetic transfer, small files, errors and interrupted checkpoints'
        run: python -m unittest discover -s tests -p "test_autotestes_falhas_v031_v034.py" -v
      - name: 'Test #38-40: many small files, metadata-only survey and isolated restoration'
        run: python -m unittest discover -s tests -p "test_autotestes_bateria_v038_v040.py" -v
      - name: 'Test #41-43: volume metadata, links and restart after write failure'
        run: python -m unittest discover -s tests -p "test_autotestes_41_43.py" -v
      - name: 'Test #44-46: paginated metadata, cursor resume, and access gaps'
        run: python -m unittest discover -s tests -p "test_inventory_paged_v044_v046.py" -v
      - name: Make space on disposable Linux runner for three synthetic copies
        if: runner.os == 'Linux'
        run: |
          # Only preinstalled Android tooling on the ephemeral hosted runner.
          sudo rm -rf /usr/local/lib/android/sdk
          df -h /tmp
      - name: 'Test #35-37: 2 GiB, abrupt child exit and cancellation guards'
        env:
          PCRO_RUN_2GIB: '1'
        run: python -m unittest discover -s tests -p "test_autotestes_escala_v035_v037.py" -v
      - name: Install virtual display for actual Tk event loop
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test actual Tk controls on Linux (display required)
        if: runner.os == 'Linux'
        env:
          PCRO_REQUIRE_TK: '1'
        run: xvfb-run -a python -m unittest discover -s tests -p "test_autotestes_escala_v035_v037.py" -v
      - name: Test actual Tk controls on Windows (display required)
        if: runner.os == 'Windows'
        env:
          PCRO_REQUIRE_TK: '1'
        run: python -m unittest discover -s tests -p "test_autotestes_escala_v035_v037.py" -v
      - name: Test backup window tabs, resize and fixed export (Linux Tk)
        if: runner.os == 'Linux'
        env:
          PCRO_REQUIRE_TK: '1'
        run: xvfb-run -a python -m unittest discover -s tests -p "test_backup_window_usability.py" -v
      - name: Test backup window tabs, resize and fixed export (Windows Tk)
        if: runner.os == 'Windows'
        env:
          PCRO_REQUIRE_TK: '1'
        run: python -m unittest discover -s tests -p "test_backup_window_usability.py" -v
      - name: Test paginated Tk window on Linux
        if: runner.os == 'Linux'
        env:
          PCRO_REQUIRE_TK: '1'
        run: xvfb-run -a python -m unittest discover -s tests -p "test_gui_inventory_paged_v044.py" -v
      - name: Test paginated Tk window on Windows
        if: runner.os == 'Windows'
        env:
          PCRO_REQUIRE_TK: '1'
        run: python -m unittest discover -s tests -p "test_gui_inventory_paged_v044.py" -v
      - name: Full regression with virtual display on Linux
        timeout-minutes: 3
        if: runner.os == 'Linux'
        env:
          PCRO_REQUIRE_TK: '1'
        run: xvfb-run -a python tests/run_full_suite.py --timeout 120
      - name: Full regression on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 9
        env:
          PCRO_REQUIRE_TK: '1'
        run: python tests/run_full_suite.py --timeout 420
      - name: Test multiple destinations and SHA-256 with temporary files
        run: python -m unittest discover -s tests -p "test_multi_destinations_v083.py" -v
      - name: Test read-only interactive backup preflight scenarios (mocked)
        run: python -m unittest discover -s tests -p "test_backup_preflight_scenario_v084.py" -v
      - name: Test backup target preflight safety (mocked)
        run: python -m unittest discover -s tests -p "test_backup_target_preflight_v082.py" -v
      - name: Test Storage Spaces physical membership (mocked)
        run: python -m unittest discover -s tests -p "test_spaces_membership_v081.py" -v
      - name: Test firmware registered boot order (mocked)
        run: python -m unittest discover -s tests -p "test_firmware_order_v080.py" -v
      - name: Test BOOTMGR cross-disk safety (mocked)
        run: python -m unittest discover -s tests -p "test_boot_dependency_v079.py" -v
      - name: Test Win32 NT volume to disk correlation (mocked)
        run: python -m unittest discover -s tests -p "test_nt_volume_mapping_v078.py" -v
      - name: Test WMI partition and BCD failure clarity (mocked)
        run: python -m unittest discover -s tests -p "test_wmi_bcd_clarity_v077.py" -v
      - name: Test safe BCD and WMI evidence (mocked)
        run: python -m unittest discover -s tests -p "test_boot_physical_evidence_v076.py" -v
      - name: Test storage evidence reconciliation (mocked)
        run: python -m unittest discover -s tests -p "test_cross_source_storage_v075.py" -v
      - name: Test safe volume extent mapping (mocked)
        run: python -m unittest discover -s tests -p "test_storage_extents_v074.py" -v
      - name: Test storage metadata consistency (mocked)
        run: python -m unittest discover -s tests -p "test_storage_consistency_v073.py" -v
      - name: Test Windows boot layout safety rules
        run: python -m unittest discover -s tests -p "test_storage_safety_v072.py" -v
      - name: Test safe interface language
        run: python -m unittest discover -s tests -p "test_interface_safety_copy_v072.py" -v
      - name: Test honest inventory coverage
        run: python -m unittest discover -s tests -p "test_coverage_truthfulness_v071.py" -v
      - name: Test drive discovery (mocked, non-destructive)
        run: python -m unittest discover -s tests -p "test_runtime_volumes_v070.py" -v
      - name: Test backup/restore on temporary test files
        run: python -m unittest discover -s tests -p "test_safe_features.py" -v


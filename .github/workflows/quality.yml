name: Quality checks
on: [push, pull_request]
jobs:
  safe-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Test GUID volume inventory (no disk writes)
        run: python -m unittest discover -s tests -p "test_volume_inventory_v071.py" -v
      - name: Test #25 isolated corruption detection and restore guard
        run: python -m unittest discover -s tests -p "test_autoteste_integridade_v025.py" -v
      - name: Test multiple destinations and SHA-256 with temporary files
        run: python -m unittest discover -s tests -p "test_multi_destinations_v083.py" -v
      - name: Test read-only interactive backup preflight scenarios (mocked)
        run: python -m unittest discover -s tests -p "test_backup_preflight_scenario_v084.py" -v
      - name: Test backup target preflight safety (mocked)
        run: python -m unittest discover -s tests -p "test_backup_target_preflight_v082.py" -v
      - name: Test Storage Spaces physical membership (mocked)
        run: python -m unittest discover -s tests -p "test_spaces_membership_v081.py" -v
      - name: Test firmware registered boot order (mocked)
        run: python -m unittest discover -s tests -p "test_firmware_order_v080.py" -v
      - name: Test BOOTMGR cross-disk safety (mocked)
        run: python -m unittest discover -s tests -p "test_boot_dependency_v079.py" -v
      - name: Test Win32 NT volume to disk correlation (mocked)
        run: python -m unittest discover -s tests -p "test_nt_volume_mapping_v078.py" -v
      - name: Test WMI partition and BCD failure clarity (mocked)
        run: python -m unittest discover -s tests -p "test_wmi_bcd_clarity_v077.py" -v
      - name: Test safe BCD and WMI evidence (mocked)
        run: python -m unittest discover -s tests -p "test_boot_physical_evidence_v076.py" -v
      - name: Test storage evidence reconciliation (mocked)
        run: python -m unittest discover -s tests -p "test_cross_source_storage_v075.py" -v
      - name: Test safe volume extent mapping (mocked)
        run: python -m unittest discover -s tests -p "test_storage_extents_v074.py" -v
      - name: Test storage metadata consistency (mocked)
        run: python -m unittest discover -s tests -p "test_storage_consistency_v073.py" -v
      - name: Test Windows boot layout safety rules
        run: python -m unittest discover -s tests -p "test_storage_safety_v072.py" -v
      - name: Test safe interface language
        run: python -m unittest discover -s tests -p "test_interface_safety_copy_v072.py" -v
      - name: Test honest inventory coverage
        run: python -m unittest discover -s tests -p "test_coverage_truthfulness_v071.py" -v
      - name: Test drive discovery (mocked, non-destructive)
        run: python -m unittest discover -s tests -p "test_runtime_volumes_v070.py" -v
      - name: Test backup/restore on temporary test files
        run: python -m unittest discover -s tests -p "test_safe_features.py" -v

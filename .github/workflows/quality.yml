name: Quality checks
on: [push, pull_request]
jobs:
  safe-unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m compileall -q .
      - name: Run non-destructive tests
        run: python -m unittest discover -s tests -p "test_runtime_volumes_v070.py" -v
